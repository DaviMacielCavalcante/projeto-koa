services:
  postgres:
    image: postgres:16-alpine
    container_name: agri-docs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agri
      POSTGRES_PASSWORD: agri
      POSTGRES_DB: agri_docs
    ports:
      - "5432:5432"
    volumes:
      - agri_docs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri -d agri_docs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agri_docs_pg_data:
